location = /aiwork {
    return 301 /aiwork/;
}

location /aiwork/api/ {
    set $octop_api http://octop:8088;
    rewrite ^/aiwork/api/(.*)$ /api/$1 break;
    proxy_pass $octop_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    client_max_body_size 200m;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# The legacy login/youli callback directory must not shadow the SPA login route.
location = /aiwork/login {
    root /var/www;
    try_files /aiwork/index.html =404;
}

location = /aiwork/login/ {
    root /var/www;
    try_files /aiwork/index.html =404;
}

location ^~ /aiwork/ {
    root /var/www;
    try_files $uri $uri/ /aiwork/index.html;
    error_page 403 = @aiwork_login_redirect;
}

# Keep API permission responses in their existing proxy location.
location @aiwork_login_redirect {
    return 302 /aiwork/login;
}

location ~ ^/api/(agents/[^/]+/chat/ws|bridge/ws|desktop-stream/ws|mobile-stream/ws|mobile/adb/shell/ws)$ {
    set $octop_ws http://octop:8088;
    proxy_pass $octop_ws;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
